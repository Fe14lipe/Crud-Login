<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peloteros · Liga Barrial de Pomasqui</title>
  <style>
    :root { --verde: #123f2f; --verde2: #1d5a42; --oro: #d9b45f; --oro-osc: #5a4310; --crema: #f2f5ee; --borde: #e0e6dc; --texto: #1f3a2e; --suave: #4a5e52; --rojo: #c0282d; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--crema); color: var(--texto); margin: 0; font-size: 14px; }
    button { font: inherit; cursor: pointer; }
    a { color: inherit; }

    /* ---------- Barra superior ---------- */
    .top { background: #fff; border-bottom: 1px solid var(--borde); position: sticky; top: 0; z-index: 10; }
    .top .in { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 20px; padding: 16px 28px; }
    .logo { font-size: 30px; font-weight: 800; color: var(--verde); letter-spacing: -1.5px; display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .logo i { width: 24px; height: 24px; border-radius: 50%; border: 3px solid var(--verde); display: grid; place-items: center; }
    .logo i::after { content: ''; width: 11px; height: 11px; border-radius: 50%; background: var(--verde); }
    .logo b { color: #a07a1c; }
    .buscador { flex: 1; max-width: 400px; position: relative; }
    .buscador input { width: 100%; padding: 11px 14px 11px 34px; border: 0; border-radius: 10px; background: #eff3ea; font-size: 14px; color: var(--texto); }
    .buscador::before { content: '⌕'; position: absolute; left: 12px; top: 8px; color: var(--suave); font-size: 18px; }
    .top nav { margin-left: auto; display: flex; gap: 26px; align-items: center; }
    .top nav a { text-decoration: none; font-size: 14px; padding: 4px 0; border-bottom: 2px solid transparent; }
    .top nav a.on { border-color: var(--oro); font-weight: 600; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background: #d8bf90; color: #5a4310; font-weight: 700; display: grid; place-items: center; font-size: 13px; border: 0; }

    .layout { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 200px 1fr; gap: 24px; padding: 22px 28px 60px; align-items: start; }
    @media (max-width: 880px) { .layout { grid-template-columns: 1fr; } .top nav a { display: none; } }

    /* ---------- Columna izquierda ---------- */
    .col-izq { display: grid; gap: 16px; position: sticky; top: 88px; }
    @media (max-width: 880px) { .col-izq { position: static; } }
    .box { background: #fff; border: 1px solid var(--borde); border-radius: 16px; overflow: hidden; }
    .perfil .banda { height: 66px; background: repeating-linear-gradient(115deg, #17503b 0 26px, #1d5a42 26px 52px); }
    .perfil .cuerpo { text-align: center; padding: 0 14px 16px; }
    .perfil .grande { width: 74px; height: 74px; font-size: 24px; margin: -37px auto 10px; border: 4px solid #fff; background: #d8bf90; color: #5a4310; display: grid; place-items: center; border-radius: 50%; font-weight: 800; }
    .perfil h3 { margin: 0 0 6px; font-size: 16px; }
    .perfil .sub { color: var(--suave); font-size: 13px; line-height: 1.5; }
    .chip { display: inline-block; margin-top: 8px; padding: 4px 9px; border-radius: 6px; background: #e6efe3; color: var(--verde2); font-size: 11px; font-weight: 600; }
    .stats { display: flex; justify-content: space-around; border-top: 1px solid var(--borde); margin-top: 14px; padding-top: 14px; }
    .stats b { display: block; font-size: 18px; }
    .stats span { font-size: 12px; color: var(--suave); }
    .btn-borde { margin-top: 14px; padding: 8px 14px; border: 1px solid var(--borde); background: #fff; border-radius: 8px; color: var(--texto); font-size: 13px; }
    .menu { padding: 8px; }
    .menu button { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 10px; border-radius: 8px; color: var(--texto); font-size: 13px; }
    .menu button.on { background: #e6efe3; font-weight: 600; }
    .menu button:hover { background: #eef4eb; }
    .menu .n { margin-left: auto; font-size: 11px; color: var(--suave); }
    .mas { padding: 0 6px; font-size: 12px; color: var(--suave); letter-spacing: .04em; }
    .mas a { display: block; margin-top: 6px; font-size: 14px; font-weight: 600; color: var(--verde); text-decoration: none; }

    /* ---------- Hero ---------- */
    main { min-width: 0; }
    .hero { background: var(--verde); color: #fff; border-radius: 18px; padding: 38px 36px; position: relative; overflow: hidden; min-height: 280px; }
    .hero .campo { position: absolute; right: 0; top: 0; width: 55%; height: 100%; opacity: .55; }
    .hero > *:not(.campo) { position: relative; }
    .eyebrow { font-size: 10px; letter-spacing: .2em; color: var(--oro); text-transform: uppercase; }
    .hero h1 { font-size: 40px; line-height: 1.08; margin: 18px 0 14px; max-width: 360px; letter-spacing: -1px; }
    .hero p { color: #d3e3da; max-width: 290px; line-height: 1.55; margin: 0 0 20px; font-size: 13px; }
    .btn-oro { padding: 13px 20px; border: 0; border-radius: 10px; background: #dcb765; color: var(--verde); font-weight: 700; font-size: 13px; }
    .hero .lema { position: absolute; right: 22px; bottom: 18px; font-size: 9px; letter-spacing: .2em; color: #9fbfae; text-transform: uppercase; text-align: right; line-height: 1.7; max-width: 160px; }

    .sec { margin: 30px 0 14px; }
    .sec .eyebrow { color: var(--suave); }
    h2 { font-size: 28px; margin: 6px 0 14px; letter-spacing: -.5px; }
    h2 .ico { color: #b08a2e; }

    /* ---------- Tarjetas doradas ---------- */
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px; }
    .carta { text-align: center; }
    .carta .oro { position: relative; height: 262px; padding: 16px 14px; color: var(--oro-osc); background: repeating-conic-gradient(from 0deg at 50% 12%, #eed694 0 6deg, #e1c273 6deg 14deg); clip-path: polygon(0 4%, 6% 0, 94% 0, 100% 4%, 100% 88%, 50% 100%, 0 88%); filter: drop-shadow(0 4px 6px rgba(90, 67, 16, .25)); }
    .carta .oro::after { content: ''; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255,255,255,.35), rgba(160,120,30,.18)); pointer-events: none; }
    .media { position: absolute; left: 16px; top: 12px; text-align: left; z-index: 1; font-weight: 800; }
    .media .num { font-size: 38px; line-height: 1; }
    .media .pos { font-size: 12px; margin-top: 8px; padding-left: 4px; }
    .media .pais { font-size: 9px; margin-top: 8px; padding-left: 4px; }
    .carta svg { position: absolute; left: 50%; top: 14px; width: 130px; height: 108px; transform: translateX(-8%); z-index: 1; }
    .carta .nombre { position: absolute; left: 0; right: 0; top: 130px; font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: .02em; z-index: 1; }
    .carta .dato { position: absolute; left: 0; right: 0; top: 152px; font-size: 11px; z-index: 1; }
    .carta .ejes { position: absolute; left: 14px; right: 14px; top: 178px; border-top: 1px solid rgba(90,67,16,.4); padding-top: 6px; display: flex; justify-content: space-around; z-index: 1; }
    .carta .ejes b { display: block; font-size: 14px; }
    .carta .ejes span { font-size: 8px; letter-spacing: .06em; }
    .carta .ver { display: block; margin: 10px auto 0; font-size: 12px; background: none; border: 0; color: var(--texto); }
    .carta .guardada { position: absolute; right: 18px; top: 14px; z-index: 2; background: none; border: 0; font-size: 18px; color: var(--oro-osc); }
    .nota { font-size: 12px; color: var(--suave); margin: 14px 0 0; }

    /* ---------- Publicar y feed ---------- */
    .compose { padding: 16px; margin-top: 26px; }
    .compose .fila { display: flex; gap: 12px; align-items: center; }
    .compose .avatar { flex: none; }
    .compose input { flex: 1; padding: 13px 14px; border: 0; border-radius: 10px; background: #eff3ea; font-size: 14px; }
    .compose .pie { display: flex; justify-content: space-between; margin-top: 12px; font-size: 11px; color: var(--suave); align-items: center; }
    .publicar { background: none; border: 0; color: var(--texto); font-size: 12px; font-weight: 600; }
    .post { padding: 16px; margin-top: 16px; }
    .post .cab { display: flex; gap: 10px; align-items: flex-start; }
    .post .logo-club { width: 38px; height: 38px; border-radius: 8px; background: #e6efe3; color: var(--verde2); font-weight: 700; font-size: 12px; display: grid; place-items: center; flex: none; }
    .post .quien { font-weight: 700; font-size: 13px; }
    .post .quien .ok { color: var(--verde2); }
    .post .cuando { font-size: 12px; color: var(--suave); margin-top: 2px; }
    .post .seguir { margin-left: auto; background: none; border: 0; font-size: 12px; color: var(--verde2); font-weight: 600; white-space: nowrap; }
    .post .texto { margin: 12px 0; line-height: 1.55; font-size: 13px; white-space: pre-wrap; }
    .marcador { background: linear-gradient(120deg, #123f2f, #24593f); border-radius: 12px; padding: 30px 20px 22px; color: #fff; text-align: center; }
    .marcador .fila { display: flex; align-items: center; justify-content: center; gap: 16px; font-size: 11px; font-weight: 600; letter-spacing: .04em; }
    .marcador .gol { font-size: 38px; font-weight: 700; color: #e0bd6c; }
    .marcador .final { font-size: 8px; letter-spacing: .1em; color: #cfe0d6; }
    .marcador .pie { margin-top: 18px; font-size: 8px; letter-spacing: .24em; text-transform: uppercase; color: #a9c6b6; }
    .acciones { display: flex; justify-content: space-between; margin-top: 12px; font-size: 12px; color: var(--suave); }
    .acciones button { background: none; border: 0; color: var(--suave); padding: 0; font-size: 12px; }
    .acciones button.on { color: var(--rojo); font-weight: 700; }
    .coment { margin-top: 12px; border-top: 1px solid var(--borde); padding-top: 10px; }
    .coment p { margin: 0 0 8px; font-size: 12px; } .coment p b { margin-right: 6px; }
    .coment form { display: flex; gap: 8px; }
    .coment input { flex: 1; padding: 8px 10px; border: 1px solid var(--borde); border-radius: 8px; }
    .coment button, .btn-p { padding: 8px 12px; border: 0; border-radius: 8px; background: var(--verde2); color: #fff; font-size: 12px; }

    /* ---------- Paneles (explorar / admin) ---------- */
    .panel { padding: 18px; overflow-x: auto; margin-bottom: 18px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--borde); }
    th { color: var(--suave); font-weight: 600; font-size: 11px; }
    td.c, th.c { text-align: center; }
    .pts { font-weight: 800; color: var(--verde2); }
    tr.lider td:first-child { box-shadow: inset 3px 0 var(--oro); }
    .equipos { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .equipo { padding: 14px; display: flex; gap: 10px; align-items: center; }
    .equipo .logo-club { width: 38px; height: 38px; border-radius: 8px; background: #e6efe3; color: var(--verde2); font-weight: 700; font-size: 12px; display: grid; place-items: center; flex: none; }
    .equipo small { display: block; color: var(--suave); font-size: 11px; }
    .equipo button { margin-left: auto; }
    form.admin { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    form.admin input, form.admin select { padding: 9px 10px; border: 1px solid var(--borde); border-radius: 8px; flex: 1; min-width: 130px; font: inherit; background: #fff; }
    form.admin label.chk { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    form.admin input[type=checkbox] { flex: none; min-width: 0; }
    .err { color: var(--rojo); min-height: 18px; margin: 0 0 8px; font-size: 13px; }
    td button { padding: 6px 10px; border: 0; border-radius: 8px; color: #fff; font-size: 12px; background: #8a5a00; }
    td button.del { background: var(--rojo); }
    .url { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge { padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 700; background: #e6efe3; color: var(--verde2); }
    .badge.vivo { background: #fde6e6; color: var(--rojo); }
    .vacio { color: var(--suave); padding: 20px 0; }
    dialog { border: 0; border-radius: 16px; padding: 22px; max-width: 340px; width: 92%; }
    dialog::backdrop { background: rgba(10, 25, 18, .55); }
    dialog .carta { margin: 10px auto 14px; max-width: 220px; }
    dialog h3 { margin: 0 0 4px; }
    dialog dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 12px 0; font-size: 13px; }
    dialog dt { color: var(--suave); } dialog dd { margin: 0; font-weight: 600; }
    dialog .acc { display: flex; gap: 8px; justify-content: flex-end; }
  </style>
</head>
<body>
<header class="top"><div class="in">
  <a class="logo" href="#" onclick="ir('inicio');return false"><i></i>Peloteros<b>.</b></a>
  <div class="buscador"><input id="buscar" type="search" placeholder="Buscar jugadores, equipos o ligas" autocomplete="off"></div>
  <nav>
    <a href="#" data-nav="inicio" onclick="ir('inicio');return false">Inicio</a>
    <a href="#" data-nav="explorar" onclick="ir('explorar');return false">Explorar</a>
    <a href="#" data-nav="red" onclick="ir('red');return false">Mi red</a>
    <a href="#" data-nav="admin" onclick="ir('admin');return false">Admin</a>
    <button class="avatar" id="logout" title="Cerrar sesión">…</button>
  </nav>
</div></header>

<div class="layout">
  <aside class="col-izq">
    <div class="box perfil">
      <div class="banda"></div>
      <div class="cuerpo">
        <div class="grande" id="ini">…</div>
        <h3 id="nombreUsuario">…</h3>
        <div class="sub">Administrador de la liga<br>Pomasqui, Ecuador</div>
        <span class="chip">● Sesión activa</span>
        <div class="stats">
          <div><b id="stPub">0</b><span>Publicaciones</span></div>
          <div><b id="stLikes">0</b><span>Me gusta</span></div>
        </div>
        <button class="btn-borde" id="misPub">Ver mis publicaciones ↗</button>
      </div>
    </div>
    <div class="box menu" id="menu">
      <button data-nav="inicio" onclick="ir('inicio')">▤ Mi vestuario</button>
      <button data-nav="guardados" onclick="ir('guardados')">☆ Jugadores guardados <span class="n" id="nGuard"></span></button>
      <button data-nav="red" onclick="ir('red')">◈ Mis equipos <span class="n" id="nSeg"></span></button>
      <button data-nav="admin" onclick="ir('admin')">✎ Administrar jugadores</button>
    </div>
    <div class="mas">TU FÚTBOL, MÁS CERCA
      <a href="https://pomasqui.sadcaftorneos.com/maxima/inicio" target="_blank" rel="noopener">Liga de Pomasqui ↗</a>
    </div>
  </aside>

  <main id="vista"></main>
</div>

<dialog id="modal"></dialog>

<script>
  // ============ utilidades ============
  const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`); // evita inyectar HTML
  const J = { 'Content-Type': 'application/json' };
  const $ = (id) => document.getElementById(id);
  const sigla = (n) => n.split(/\s+/).map((p) => p[0]).join('').slice(0, 2).toUpperCase();
  const hace = (f) => {
    const m = Math.max(0, (Date.now() - new Date(f).getTime()) / 60000);
    return m < 1 ? 'Ahora' : m < 60 ? `Hace ${Math.floor(m)} min` : m < 1440 ? `Hace ${Math.floor(m / 60)} h` : `Hace ${Math.floor(m / 1440)} d`;
  };

  // Si la sesión expiró el servidor responde 401 y volvemos al login. Los errores del back-end se muestran.
  async function api(url, opts, errEl) {
    const res = await fetch(url, opts);
    if (res.status === 401) { location.href = '/login.html'; throw new Error('401'); }
    const data = await res.json();
    if (!res.ok) { if (errEl) errEl.textContent = data.error; else alert(data.error); throw new Error(data.error); }
    if (errEl) errEl.textContent = '';
    return data;
  }
  const post = (url, body, errEl) => api(url, { method: 'POST', headers: J, body: JSON.stringify(body ?? {}) }, errEl);

  // ============ estado ============
  let vista = 'inicio', yo = {}, jugadores = [], publicaciones = [], equipos = [], liga = { posiciones: [], goleadores: [] }, streams = [];
  let soloMias = false, editJ = null, editS = null;

  // ============ tarjeta dorada ============
  const PIEL = ['#c98f5f', '#8a5a3c', '#d9a074', '#6b4228'], PELO = ['#2a1b14', '#1a1210', '#3b2a1c', '#14100e'];
  const cara = (id) => `<svg viewBox="0 0 120 100"><circle cx="60" cy="26" r="17" fill="${PIEL[id % 4]}"/><path d="M43 22c0-12 8-17 17-17s17 5 17 17c-6-5-10-7-17-7s-11 2-17 7z" fill="${PELO[id % 4]}"/><path d="M52 32q8 6 16 0" stroke="#fff" stroke-width="2.4" fill="none"/><path d="M37 52l-26 12 7 20 14-5v21h56V79l14 5 7-20-26-12c-4 8-12 12-22 12s-18-4-22-12z" fill="#123f2f"/><path d="M84 62l2 4 5 .5-3.5 3 1 4.5-4.5-2.5-4.5 2.5 1-4.5-3.5-3 5-.5z" fill="#d9b45f"/></svg>`;
  const carta = (j, botones = true) => `
    <div class="carta">
      <div class="oro">
        <div class="media"><div class="num">${j.media}</div><div class="pos">${esc(j.posicion)}</div><div class="pais">EC</div></div>
        ${botones ? `<button class="guardada" title="${j.guardado ? 'Quitar de guardados' : 'Guardar jugador'}" onclick="guardar(${j.id})">${j.guardado ? '★' : '☆'}</button>` : ''}
        ${cara(j.id)}
        <div class="nombre">${esc(j.nombre)}</div>
        <div class="dato">${j.edad} AÑOS · ${esc(j.equipo)}</div>
        <div class="ejes"><div><b>${j.ritmo}</b><span>RITMO</span></div><div><b>${j.tiro}</b><span>TIRO</span></div><div><b>${j.pase}</b><span>PASE</span></div></div>
      </div>
      ${botones ? `<button class="ver" onclick="perfil(${j.id})">Ver perfil ↗</button>` : ''}
    </div>`;

  const filtro = () => buscar.value.trim().toLowerCase();
  const coincide = (...xs) => { const f = filtro(); return !f || xs.some((x) => String(x).toLowerCase().includes(f)); };

  // ============ vistas ============
  const vInicio = () => {
    const f = filtro();
    const lista = jugadores.filter((j) => coincide(j.nombre, j.equipo, j.posicion));
    const mostrar = f ? lista : lista.slice(0, 3);
    const posts = publicaciones.filter((p) => (!soloMias || p.autor === yo.usuario) && coincide(p.texto, p.autor));
    return `
    <section class="hero">
      <svg class="campo" viewBox="0 0 300 280" fill="none" stroke="#fff" stroke-opacity=".5"><circle cx="170" cy="130" r="62"/><path d="M110 0c60 40 120 70 190 160M200 280c-20-60 0-120 100-170" /></svg>
      <div class="eyebrow">Del barrio a lo grande</div>
      <h1>Tu talento merece otra cancha.</h1>
      <p>Conecta con jugadores, encuentra equipo y haz que tu juego hable por ti.</p>
      <button class="btn-oro" onclick="$('promesas').scrollIntoView({behavior:'smooth'})">Descubrir talento &nbsp;→</button>
      <div class="lema">El próximo crack<br>está en tu barrio.</div>
    </section>

    <div class="sec" id="promesas"><div class="eyebrow">El futuro juega aquí</div><h2>Jóvenes promesas <span class="ico">✦</span></h2></div>
    <div class="cards">${mostrar.map((j) => carta(j)).join('') || '<p class="vacio">Sin resultados</p>'}</div>
    <p class="nota">Perfiles y valoraciones ilustrativos · Potencial barrial</p>

    <div class="box compose">
      <form class="fila" id="fPub"><span class="avatar">${esc(yo.ini)}</span>
        <input id="txtPub" maxlength="500" placeholder="¿Qué se juega hoy, ${esc(yo.usuario)}?" autocomplete="off"></form>
      <div class="pie"><span id="errPub" class="err" style="margin:0"></span><button class="publicar" onclick="publicar()">Publicar ↗</button></div>
    </div>
    ${soloMias ? '<p class="nota">Mostrando solo tus publicaciones · <a href="#" onclick="soloMias=false;pintar();return false">ver todas</a></p>' : ''}
    ${posts.map(post_).join('') || '<p class="vacio">No hay publicaciones.</p>'}`;
  };

  const post_ = (p) => `
    <article class="box post" id="p${p.id}">
      <div class="cab">
        <div class="logo-club">${esc(sigla(p.autor))}</div>
        <div><div class="quien">${esc(p.autor)} ${p.equipo_id ? '<span class="ok">✓</span>' : ''}</div>
          <div class="cuando">${esc(p.liga || 'Comunidad')} · ${hace(p.creado_en)}</div></div>
        ${p.equipo_id ? `<button class="seguir" onclick="seguir(${p.equipo_id})">${p.seguido ? '✓ Siguiendo' : '+ Seguir'}</button>`
          : p.autor === yo.usuario ? `<button class="seguir" onclick="borrarPub(${p.id})">✕ Borrar</button>` : ''}
      </div>
      <div class="texto">${esc(p.texto)}</div>
      ${p.local_nombre ? `<div class="marcador"><div class="fila"><span>${esc(p.local_nombre.toUpperCase())}</span><span class="gol">${p.local_goles}</span><span class="final">FINAL</span><span class="gol">${p.visita_goles}</span><span>${esc(p.visita_nombre.toUpperCase())}</span></div><div class="pie">${esc(p.pie || '')}</div></div>` : ''}
      <div class="acciones">
        <button class="${p.liked ? 'on' : ''}" onclick="like(${p.id})">${p.liked ? '♥' : '♡'} Me gusta · ${p.likes}</button>
        <button onclick="comentarios(${p.id})">${p.comentarios} comentarios</button>
      </div>
      <div class="coment" id="c${p.id}" hidden></div>
    </article>`;

  const vExplorar = () => `
    <div class="sec"><h2>Tabla de posiciones · segunda etapa</h2></div>
    <div class="box panel"><table>
      <thead><tr><th class="c">#</th><th>Equipo</th><th class="c">PJ</th><th class="c">PG</th><th class="c">PE</th><th class="c">PP</th><th class="c">GF</th><th class="c">GC</th><th class="c">DG</th><th class="c">Pts</th></tr></thead>
      <tbody>${liga.posiciones.filter((p) => coincide(p.nombre)).map((p, i) => `<tr class="${i === 0 ? 'lider' : ''}"><td class="c">${i + 1}</td><td>${esc(p.nombre)}</td><td class="c">${p.pj}</td><td class="c">${p.pg}</td><td class="c">${p.pe}</td><td class="c">${p.pp}</td><td class="c">${p.gf}</td><td class="c">${p.gc}</td><td class="c">${p.dg}</td><td class="c pts">${p.pts}</td></tr>`).join('')}</tbody></table></div>
    <div class="sec"><h2>Goleadores de la liga</h2></div>
    <div class="box panel"><table><thead><tr><th class="c">#</th><th>Jugador</th><th>Equipo</th><th class="c">Goles</th></tr></thead>
      <tbody>${liga.goleadores.filter((g) => coincide(g.nombre, g.equipo)).map((g, i) => `<tr><td class="c">${i + 1}</td><td>${esc(g.nombre)}</td><td>${esc(g.equipo)}</td><td class="c pts">${g.goles}</td></tr>`).join('')}</tbody></table>
      <p class="nota">Fuente: <a href="https://pomasqui.sadcaftorneos.com/maxima/inicio" target="_blank" rel="noopener">pomasqui.sadcaftorneos.com</a> · categoría MAXIMA</p></div>
    <div class="sec"><h2>Equipos</h2></div>${gridEquipos(equipos.filter((e) => coincide(e.nombre)))}`;

  const gridEquipos = (lista) => `<div class="equipos">${lista.map((e) => `
    <div class="box equipo"><div class="logo-club">${esc(e.sigla)}</div><div><b>${esc(e.nombre)}</b><small>Fundado ${esc(String(e.fundado).slice(0, 4))}</small></div>
      <button class="btn-borde" style="margin:0" onclick="seguir(${e.id})">${e.seguido ? '✓ Siguiendo' : '+ Seguir'}</button></div>`).join('') || '<p class="vacio">Sin equipos.</p>'}</div>`;

  const vRed = () => `<div class="sec"><div class="eyebrow">Tu fútbol, más cerca</div><h2>Mis equipos</h2></div>
    ${gridEquipos(equipos.filter((e) => e.seguido && coincide(e.nombre))) }
    <p class="nota">Sigue equipos desde Explorar o con el botón “+ Seguir” de sus publicaciones.</p>`;

  const vGuardados = () => {
    const l = jugadores.filter((j) => j.guardado && coincide(j.nombre, j.equipo));
    return `<div class="sec"><h2>Jugadores guardados</h2></div><div class="cards">${l.map((j) => carta(j)).join('') || '<p class="vacio">Aún no guardas jugadores. Usa ☆ en una tarjeta.</p>'}</div>`;
  };

  // La cédula es un dato sensible: en la tabla solo se muestran los 2 primeros y los 2 últimos dígitos
  const mascara = (c) => (c ? `${esc(c.slice(0, 2))}••••••${esc(c.slice(-2))}` : '—');

  const vAdmin = () => `
    <div class="sec"><h2>Administrar jugadores</h2></div>
    <div class="box panel">
      <form class="admin" id="fJ">
        <input id="jCedula" inputmode="numeric" maxlength="10" placeholder="Cédula (10 dígitos)" required autocomplete="off">
        <input id="jNombre" placeholder="Nombre completo" required>
        <select id="jPais" required></select>
        <select id="jLiga" required><option value="">Liga...</option></select>
        <select id="jEquipo" required><option value="">Equipo...</option></select>
        <select id="jPos">${['POR','DFC','LD','LI','MCD','MC','MCO','ED','EI','DC'].map((p) => `<option>${p}</option>`).join('')}</select>
        <input id="jEdad" type="number" min="14" max="60" placeholder="Edad" required>
        <input id="jRitmo" type="number" min="1" max="99" placeholder="Ritmo" required>
        <input id="jTiro" type="number" min="1" max="99" placeholder="Tiro" required>
        <input id="jPase" type="number" min="1" max="99" placeholder="Pase" required>
        <label class="chk"><input id="jDisp" type="checkbox" checked> Disponible</label>
        <button class="btn-p" id="jSave">${editJ ? 'Guardar cambios' : 'Agregar jugador'}</button>
      </form>
      <p class="err" id="errJ"></p>
      <table><thead><tr><th>Cód.</th><th>Cédula</th><th>Jugador</th><th>Equipo</th><th>Pos</th><th class="c">Edad</th><th class="c">Media</th><th></th></tr></thead>
        <tbody>${jugadores.map((j) => `<tr><td>${j.codigo}</td><td>${mascara(j.cedula)}</td><td>${esc(j.nombre)}</td><td>${esc(j.equipo)}</td><td>${esc(j.posicion)}</td><td class="c">${j.edad}</td><td class="c pts">${j.media}</td>
          <td><button onclick="editarJ(${j.id})">Editar</button> <button class="del" onclick="borrarJ(${j.id})">Eliminar</button></td></tr>`).join('')}</tbody></table>
    </div>

    <div class="sec"><h2>Administración de streams</h2></div>
    <div class="box panel">
      <form class="admin" id="fS">
        <input id="sTitulo" placeholder="Partido (ej. Aston F.C. vs Manabí F.C.)" required>
        <select id="sPais" required></select>
        <select id="sLiga" required><option value="">Liga...</option></select>
        <select id="sEstado"><option>EN VIVO</option><option>PRÓXIMO</option><option>FINALIZADO</option></select>
        <input id="sUrl" type="url" placeholder="URL del stream (https://...)" required>
        <button class="btn-p" id="sSave">${editS ? 'Guardar cambios' : 'Agregar'}</button>
      </form>
      <p class="err" id="errS"></p>
      <table><thead><tr><th>Partido</th><th>País</th><th>Liga</th><th>Estado</th><th>URL</th><th></th></tr></thead>
        <tbody>${streams.map((s) => `<tr><td>${esc(s.titulo)}</td><td>${esc(s.pais)}</td><td>${esc(s.liga)}</td>
          <td><span class="badge ${s.estado === 'EN VIVO' ? 'vivo' : ''}">${esc(s.estado)}</span></td><td class="url" title="${esc(s.url)}">${esc(s.url)}</td>
          <td><button onclick="editarS(${s.id})">Editar</button> <button class="del" onclick="borrarS(${s.id})">Eliminar</button></td></tr>`).join('')}</tbody></table>
    </div>`;

  // ============ render ============
  function pintar() {
    document.querySelectorAll('[data-nav]').forEach((b) => b.classList.toggle('on', b.dataset.nav === vista || (vista === 'inicio' && b.dataset.nav === 'inicio')));
    $('vista').innerHTML = { inicio: vInicio, explorar: vExplorar, red: vRed, guardados: vGuardados, admin: vAdmin }[vista]();
    $('nGuard').textContent = yo.guardados || ''; $('nSeg').textContent = yo.seguidos || '';
    $('stPub').textContent = yo.publicaciones ?? 0; $('stLikes').textContent = yo.me_gusta ?? 0;
    if (vista === 'inicio') {
      $('fPub').addEventListener('submit', (e) => { e.preventDefault(); publicar(); });
    }
    if (vista === 'admin') iniciarAdmin();
  }

  async function ir(v) { vista = v; if (v === 'inicio') soloMias = false; await refrescar(); window.scrollTo({ top: 0 }); }

  // Recarga lo que necesita la vista actual
  async function refrescar() {
    const tareas = [api('/api/yo').then((d) => { yo = { ...d, ini: d.usuario.slice(0, 2).toUpperCase() }; })];
    if (['inicio', 'guardados', 'admin'].includes(vista)) tareas.push(api('/api/jugadores').then((d) => (jugadores = d)));
    if (vista === 'inicio') tareas.push(api('/api/publicaciones').then((d) => (publicaciones = d)));
    if (['explorar', 'red'].includes(vista)) tareas.push(api('/api/equipos').then((d) => (equipos = d)));
    if (vista === 'explorar') tareas.push(api('/api/liga').then((d) => (liga = d)));
    if (vista === 'admin') tareas.push(api('/api/streams').then((d) => (streams = d)));
    await Promise.all(tareas);
    $('nombreUsuario').textContent = yo.usuario; $('ini').textContent = yo.ini; $('logout').textContent = yo.ini;
    pintar();
  }

  // ============ acciones sociales ============
  async function publicar() {
    const t = $('txtPub'); const el = $('errPub');
    try { await post('/api/publicaciones', { texto: t.value }, el); } catch { return; }
    refrescar();
  }
  const like = async (id) => { await post(`/api/publicaciones/${id}/like`); refrescar(); };
  const seguir = async (id) => { await post(`/api/equipos/${id}/seguir`); refrescar(); };
  const guardar = async (id) => { await post(`/api/jugadores/${id}/guardar`); if ($('modal').open) $('modal').close(); refrescar(); };
  async function borrarPub(id) { if (confirm('¿Borrar esta publicación?')) { await api(`/api/publicaciones/${id}`, { method: 'DELETE' }); refrescar(); } }

  async function comentarios(id) {
    const box = $('c' + id);
    if (!box.hidden) { box.hidden = true; return; }
    const lista = await api(`/api/publicaciones/${id}/comentarios`);
    box.innerHTML = lista.map((c) => `<p><b>${esc(c.usuario)}</b>${esc(c.texto)}</p>`).join('') +
      `<form onsubmit="return comentar(event, ${id})"><input maxlength="300" placeholder="Escribe un comentario..." required><button>Enviar</button></form><p class="err"></p>`;
    box.hidden = false;
  }
  async function comentar(e, id) {
    e.preventDefault();
    const f = e.target;
    try { await post(`/api/publicaciones/${id}/comentarios`, { texto: f.querySelector('input').value }, f.nextElementSibling); } catch { return false; }
    await refrescar(); comentarios(id);
    return false;
  }

  // Perfil del jugador (no se muestra el código, que es dato sensible)
  function perfil(id) {
    const j = jugadores.find((x) => x.id === id);
    $('modal').innerHTML = `${carta(j, false)}<h3>${esc(j.nombre)}</h3>
      <dl><dt>Equipo</dt><dd>${esc(j.equipo)}</dd><dt>Posición</dt><dd>${esc(j.posicion)}</dd><dt>Edad</dt><dd>${j.edad} años</dd>
      <dt>Estado</dt><dd>${j.disponible ? 'Disponible para pruebas' : 'No disponible'}</dd></dl>
      <div class="acc"><button class="btn-borde" style="margin:0" onclick="$('modal').close()">Cerrar</button>
      <button class="btn-p" onclick="guardar(${id})">${j.guardado ? '★ Quitar de guardados' : '☆ Guardar jugador'}</button></div>`;
    $('modal').showModal();
  }

  // ============ administración ============
  // Dropdowns dependientes: país -> liga (-> equipo)
  async function llenarPaises(sel) {
    const p = await api('/api/paises');
    sel.innerHTML = '<option value="">País...</option>' + p.map((x) => `<option value="${x.id}">${esc(x.nombre)}</option>`).join('');
  }
  async function llenarLigas(sel, paisId, valor = '') {
    const l = paisId ? await api(`/api/paises/${paisId}/ligas`) : [];
    sel.innerHTML = '<option value="">Liga...</option>' + l.map((x) => `<option value="${x.id}">${esc(x.nombre)}</option>`).join('');
    sel.value = valor;
  }
  async function llenarEquipos(ligaId, valor = '') {
    const e = ligaId ? await api(`/api/ligas/${ligaId}/equipos`) : [];
    $('jEquipo').innerHTML = '<option value="">Equipo...</option>' + e.map((x) => `<option value="${x.id}">${esc(x.nombre)}</option>`).join('');
    $('jEquipo').value = valor;
  }

  async function iniciarAdmin() {
    await Promise.all([llenarPaises($('jPais')), llenarPaises($('sPais'))]);
    $('jPais').onchange = async () => { await llenarLigas($('jLiga'), $('jPais').value); llenarEquipos(''); };
    $('jLiga').onchange = () => llenarEquipos($('jLiga').value);
    $('sPais').onchange = () => llenarLigas($('sLiga'), $('sPais').value);
    $('fJ').onsubmit = guardarJ; $('fS').onsubmit = guardarS;
    if (editJ) rellenarJ(jugadores.find((x) => x.id === editJ));
    if (editS) rellenarS(streams.find((x) => x.id === editS));
  }

  async function guardarJ(e) {
    e.preventDefault();
    const body = { cedula: $('jCedula').value, nombre: $('jNombre').value, posicion: $('jPos').value, edad: $('jEdad').value,
      ritmo: $('jRitmo').value, tiro: $('jTiro').value, pase: $('jPase').value, equipo_id: $('jEquipo').value, disponible: $('jDisp').checked };
    try { await api(editJ ? `/api/jugadores/${editJ}` : '/api/jugadores', { method: editJ ? 'PUT' : 'POST', headers: J, body: JSON.stringify(body) }, $('errJ')); }
    catch { return; }
    editJ = null; refrescar();
  }
  async function rellenarJ(j) {
    $('jCedula').value = j.cedula || ''; $('jNombre').value = j.nombre; $('jPos').value = j.posicion; $('jEdad').value = j.edad;
    $('jRitmo').value = j.ritmo; $('jTiro').value = j.tiro; $('jPase').value = j.pase; $('jDisp').checked = j.disponible;
    $('jPais').value = j.pais_id; await llenarLigas($('jLiga'), j.pais_id, j.liga_id); await llenarEquipos(j.liga_id, j.equipo_id);
  }
  function editarJ(id) { editJ = id; refrescar().then(() => $('fJ').scrollIntoView({ behavior: 'smooth', block: 'center' })); }
  async function borrarJ(id) { if (confirm('¿Eliminar este jugador?')) { await api(`/api/jugadores/${id}`, { method: 'DELETE' }); refrescar(); } }

  async function guardarS(e) {
    e.preventDefault();
    const body = { titulo: $('sTitulo').value, liga_id: $('sLiga').value, estado: $('sEstado').value, url: $('sUrl').value };
    try { await api(editS ? `/api/streams/${editS}` : '/api/streams', { method: editS ? 'PUT' : 'POST', headers: J, body: JSON.stringify(body) }, $('errS')); }
    catch { return; }
    editS = null; refrescar();
  }
  async function rellenarS(s) {
    $('sTitulo').value = s.titulo; $('sEstado').value = s.estado; $('sUrl').value = s.url;
    $('sPais').value = s.pais_id; await llenarLigas($('sLiga'), s.pais_id, s.liga_id);
  }
  function editarS(id) { editS = id; refrescar().then(() => $('fS').scrollIntoView({ behavior: 'smooth', block: 'center' })); }
  async function borrarS(id) { if (confirm('¿Eliminar este stream?')) { await api(`/api/streams/${id}`, { method: 'DELETE' }); refrescar(); } }

  // ============ eventos globales ============
  buscar.addEventListener('input', () => { if (vista !== 'admin') pintar(); }); // en admin no, para no borrar lo que se está escribiendo
  $('misPub').addEventListener('click', () => { soloMias = true; vista = 'inicio'; refrescar(); });
  $('logout').addEventListener('click', async () => { await fetch('/api/logout', { method: 'POST' }); location.href = '/login.html'; });

  refrescar();
</script>
</body>
</html>
